[project]
name = "copaceticmouse"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "copaceticmouse", email = "copaceticfrog@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[tool.maturin]
module-name = "copaceticmouse._core"
python-packages = ["copaceticmouse"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
