[project]
name = "copaceticmouse"
version = "0.1.3"
description = "Added new subpackage model"
readme = "README.md"
authors = [
    { name = "copaceticmouse", email = "copaceticfrog@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "polars>=2.0.0",
    "scipy>=1.18.1",
    "torch>=2.14.1",
]

[tool.maturin]
module-name = "copaceticmouse._core"
python-packages = ["copaceticmouse"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
